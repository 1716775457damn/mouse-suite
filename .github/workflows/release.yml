name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mouse-suite-windows-x86_64.exe
            bin: mouse-suite.exe
          # xcap 0.9+ needs PipeWire headers newer than Ubuntu 22.04 ships
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: mouse-suite-linux-x86_64
            bin: mouse-suite
          # Cross-compile Intel mac from Apple Silicon (macos-13 runners queue forever)
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: mouse-suite-macos-x86_64
            bin: mouse-suite
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: mouse-suite-macos-aarch64
            bin: mouse-suite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev pkg-config libclang-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libevdev-dev libpipewire-0.3-dev libwayland-dev \
            libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libgbm-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.artifact }}"
          Copy-Item config.toml dist/
          Copy-Item AGENT_BRIDGE.md dist/
          Copy-Item README.md dist/
          if (Test-Path workflows) { Copy-Item workflows dist/ -Recurse -Force }
          Compress-Archive -Path dist\* -DestinationPath "dist/${{ matrix.artifact }}.zip" -Force

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.artifact }}"
          chmod +x "dist/${{ matrix.artifact }}"
          cp config.toml AGENT_BRIDGE.md README.md dist/
          if [ -d workflows ]; then cp -r workflows dist/; fi
          tar -C dist -czf "dist/${{ matrix.artifact }}.tar.gz" \
            --exclude='*.zip' --exclude='*.tar.gz' .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.tar.gz

  release:
    name: publish-release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p upload
          find artifacts -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.tar.gz' -o -name 'mouse-suite-*' \) \
            ! -name '*.md' ! -name 'config.toml' -exec cp {} upload/ \;
          ls -lah upload

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: upload/*
          body: |
            ## Mouse Suite ${{ github.ref_name }}

            Multi-platform builds:

            - **Windows x86_64**: full recorder / clicker / flow / agent bridge
            - **Linux x86_64** (Ubuntu 24.04+): experimental (GUI + agent bridge; click injection stubbed)
            - **macOS x86_64 / aarch64**: experimental (GUI + agent bridge; click injection stubbed)

            See `AGENT_BRIDGE.md` for agent automation API.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

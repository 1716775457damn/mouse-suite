<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mouse Suite — Clicker</title>
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <div class="app">
    <header class="chrome">
      <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
      <div class="brand">
        <div class="brand-mark"></div>
        <div><strong>Mouse Suite</strong><span>桌面自动化套件</span></div>
      </div>
      <div class="pill run">运行中</div>
      <nav class="tabs">
        <button class="tab">录制</button>
        <button class="tab active">点击</button>
        <button class="tab">流程</button>
        <button class="tab">书写</button>
      </nav>
      <div class="chrome-actions">
        <button class="icon-btn" type="button" onclick="toggleTheme()">◐</button>
      </div>
    </header>
    <div class="main" style="flex-direction:column">
      <section class="content" style="flex:1">
        <div class="row spread">
          <div>
            <h1 style="font-size:20px">点击器</h1>
            <p class="muted">按 CSV 或工作流批量执行点击。</p>
          </div>
          <div class="seg">
            <button class="active">CSV</button>
            <button>工作流</button>
          </div>
        </div>
        <div class="card" style="display:grid; gap:12px; max-width:560px">
          <div class="field">
            <label>任务文件</label>
            <div class="row">
              <input value="tasks/login-batch.csv" readonly style="flex:1" />
              <button class="btn btn-secondary">浏览</button>
            </div>
          </div>
          <div class="row" style="gap:16px">
            <div class="field" style="flex:1">
              <label>间隔 (ms)</label>
              <input type="number" value="350" />
            </div>
            <div class="field" style="flex:1">
              <label>失败策略</label>
              <select><option>失败跳过</option><option>失败中止</option></select>
            </div>
          </div>
          <div class="row">
            <button class="btn btn-primary">开始运行</button>
            <button class="btn btn-secondary">停止</button>
            <button class="btn btn-ghost">清空日志</button>
          </div>
        </div>
        <div>
          <div class="row spread" style="margin-bottom:8px">
            <h2 style="margin:0">运行日志</h2>
            <span class="muted">12 / 40 步</span>
          </div>
          <div class="log">
            [14:02:11] OK  click 登录按钮 (942, 318)<br />
            [14:02:12] OK  type 用户名<br />
            [14:02:12] WARN 未匹配 提交 · 跳过<br />
            [14:02:13] OK  wait 800ms
          </div>
        </div>
      </section>
    </div>
  </div>
  <script>
    function toggleTheme() {
      if (document.documentElement.getAttribute('data-theme') === 'dark')
        document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
</body>
</html>

[package]
name = "mouse-suite"
version = "0.2.10"
edition = "2021"
description = "Recorder + clicker + visual workflow editor with agent bridge"
license = "MIT"
repository = "https://github.com/1716775457damn/mouse-suite"
readme = "README.md"
build = "build.rs"

[dependencies]
eframe = "0.30"
rdev = { version = "0.5", features = ["unstable_grab"] }
chrono = "0.4"
xcap = "0.9"
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
rfd = "0.15"
ureq = { version = "2.12", features = ["json"] }
base64 = "0.22"

[target.'cfg(not(windows))'.dependencies]
enigo = "0.3"
global-hotkey = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
